[package]
name = "tauri-plugin-screenshot"
version = "0.1.0"
description = "In-app webview screenshot and color picking for Tauri applications (OpenHarmony)."
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-screenshot"

[package.metadata.platforms.support]
windows = { level = "none", notes = "returns unsupported" }
linux = { level = "none", notes = "returns unsupported" }
macos = { level = "none", notes = "returns unsupported" }
android = { level = "none", notes = "" }
ios = { level = "none", notes = "" }
ohos = { level = "partial", notes = "webview screenshot + color pick" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[target.'cfg(target_env = "ohos")'.dependencies]
openharmony-ability-plugin-screenshot = { path = "../../../openharmony-ability/crates/plugin-screenshot" }
