[package]
name = "tauri-plugin-accessibility"
version = "0.1.0"
description = "Accessibility queries (font scale, screen reader state) for Tauri applications (OpenHarmony)."
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-accessibility"

[package.metadata.platforms.support]
windows = { level = "none", notes = "returns unsupported" }
linux = { level = "none", notes = "returns unsupported" }
macos = { level = "none", notes = "returns unsupported" }
android = { level = "none", notes = "" }
ios = { level = "none", notes = "" }
ohos = { level = "partial", notes = "font scale + screen reader state queries and state-change event" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[target.'cfg(target_env = "ohos")'.dependencies]
openharmony-ability-plugin-accessibility = { git = "https://github.com/Eulogizethesun/openharmony-ability", branch = "ohdev-git" }
futures-executor = "0.3"
