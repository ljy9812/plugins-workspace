[package]
name = "tauri-plugin-continuation"
version = "0.1.0"
description = "App continuation restore queries for Tauri applications (OpenHarmony)."
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-continuation"

[package.metadata.platforms.support]
windows = { level = "none", notes = "returns unsupported" }
linux = { level = "none", notes = "returns unsupported" }
macos = { level = "none", notes = "returns unsupported" }
android = { level = "none", notes = "" }
ios = { level = "none", notes = "" }
ohos = { level = "partial", notes = "passive continuation restore query + payload retrieval; active migration is system-UI exclusive" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[target.'cfg(target_env = "ohos")'.dependencies]
openharmony-ability-plugin-continuation = { path = "../../../openharmony-ability/crates/plugin-continuation" }
