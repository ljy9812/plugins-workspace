[package]
name = "tauri-plugin-nfc"
version = "2.3.5"
description = "Read and write NFC tags on Android and iOS."
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-nfc"

[package.metadata.docs.rs]
targets = ["x86_64-linux-android"]

[package.metadata.platforms.support]
windows = { level = "none", notes = "" }
linux = { level = "none", notes = "" }
macos = { level = "none", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }
openharmony = { level = "partial", notes = "is_available/scan/write via NFC readerMode foreground dispatch (Android Session semantics); mimeType/uri scan filters have no platform equivalent and are ignored; Rust-side Nfc::scan()/write() hit an upstream models deserialization bug — use the JS plugin API on all platforms" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde_repr = "0.1"

[target.'cfg(any(target_os = "ios", target_env = "ohos"))'.dependencies]
tauri = { workspace = true, features = ["wry"] }
