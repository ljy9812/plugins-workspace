[package]
name = "tauri-plugin-os"
version = "2.3.2"
description = "Read information about the operating system."
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-os"

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }
ohos = { level = "partial", notes = "version() maps distribution API version; locale() from preferred locales; hostname() returns constant (no public API)" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
os_info = "3"
serialize-to-javascript = "0.1.1"

[target.'cfg(not(target_env = "ohos"))'.dependencies]
sys-locale = "0.3"
gethostname = "1.0"
